name: Android APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to attach the APK to a release on tag pushes

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PCV2_MOCK_URL: http://127.0.0.1:5035
      PCV2_VERSION_CODE: ${{ github.run_number }}
      PCV2_VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('1.0.{0}', github.run_number) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test the mock server
        working-directory: mock-server
        run: |
          pip install -r requirements.txt pytest
          pytest -q

      - name: Start the mock server
        working-directory: mock-server
        run: |
          nohup python mock_server.py --port 5035 --token test-token > mock.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:5035/mock/state > /dev/null && exit 0; sleep 1; done
          cat mock.log; exit 1

      - uses: android-actions/setup-android@v3
        with:
          # The default ("tools") no longer exists in the SDK repository
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Release signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.PCV2_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "PCV2_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing the release APK with the PCV2_KEYSTORE_BASE64 secret"
          else
            echo "No PCV2_KEYSTORE_BASE64 secret: the release APK is signed with the debug key"
          fi

      - name: Unit, API and UI tests (against the mock server)
        run: ./gradlew --stacktrace testDebugUnitTest

      - name: Build APKs
        env:
          PCV2_KEYSTORE_PASSWORD: ${{ secrets.PCV2_KEYSTORE_PASSWORD }}
          PCV2_KEY_ALIAS: ${{ secrets.PCV2_KEY_ALIAS }}
          PCV2_KEY_PASSWORD: ${{ secrets.PCV2_KEY_PASSWORD }}
        run: |
          ./gradlew --stacktrace assembleDebug assembleRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/pcv2-${PCV2_VERSION_NAME}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/pcv2-${PCV2_VERSION_NAME}-debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: pcv2-apk-${{ env.PCV2_VERSION_NAME }}
          path: dist/*.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: app/build/screenshots/

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            mock-server/mock.log

      - name: Attach the APK to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/pcv2-${{ env.PCV2_VERSION_NAME }}.apk
